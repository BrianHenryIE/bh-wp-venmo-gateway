name: Update "Tested up to" headers

# Updates the plugin headers:
#  - `Tested up to` in bh-wp-venmo-gateway.php, readme.txt and README.txt is set to the higher of the existing header or the WordPress version in composer.lock.
#  - `WC tested up to` in bh-wp-venmo-gateway.php is set to the higher of the existing header or the WooCommerce version in composer.lock.
#  - `Requires at least` in readme.txt and README.txt is set to match the `Requires at least` header in bh-wp-venmo-gateway.php.
# Only major.minor is used, never the patch version.
#
# Versions are read from composer.lock (`johnpbloch/wordpress` and `wpackagist-plugin/woocommerce`), so no `composer install` is needed.
#
# @author BrianHenryIE

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-tested-up-to:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Update headers
        id: update
        run: |
          set -euo pipefail

          PLUGIN_FILE="bh-wp-venmo-gateway.php"
          README_FILES="readme.txt README.txt"

          # Reduce a version string to major.minor.
          major_minor() {
            echo "$1" | grep -oE '^[0-9]+\.[0-9]+'
          }

          # Print the higher of two major.minor versions.
          higher() {
            printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1
          }

          # Version of a package in composer.lock (checks both `packages` and `packages-dev`).
          lock_version() {
            jq -r --arg name "$1" '(.packages + .["packages-dev"])[] | select(.name == $name) | .version' composer.lock | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1
          }

          WP_VERSION=$(major_minor "$(lock_version johnpbloch/wordpress)")
          WC_VERSION=$(major_minor "$(lock_version wpackagist-plugin/woocommerce)")

          CURRENT_WP=$(major_minor "$(grep -oE '^ \* Tested up to: *[0-9]+(\.[0-9]+)*' "$PLUGIN_FILE" | grep -oE '[0-9]+(\.[0-9]+)*')")
          CURRENT_WC=$(major_minor "$(grep -oE '^ \* WC tested up to: *[0-9]+(\.[0-9]+)*' "$PLUGIN_FILE" | grep -oE '[0-9]+(\.[0-9]+)*')")
          REQUIRES_WP=$(major_minor "$(grep -oE '^ \* Requires at least: *[0-9]+(\.[0-9]+)*' "$PLUGIN_FILE" | grep -oE '[0-9]+(\.[0-9]+)*')")

          NEW_WP=$(higher "$CURRENT_WP" "$WP_VERSION")
          NEW_WC=$(higher "$CURRENT_WC" "$WC_VERSION")

          echo "composer.lock WordPress: $WP_VERSION (header currently $CURRENT_WP)"
          echo "composer.lock WooCommerce: $WC_VERSION (header currently $CURRENT_WC)"
          echo "Plugin header Requires at least: $REQUIRES_WP"

          # Replace only the version, preserving the existing whitespace alignment.
          sed -E -i "s/^( \* Tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WP}/" "$PLUGIN_FILE"
          sed -E -i "s/^( \* WC tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WC}/" "$PLUGIN_FILE"
          # Only README.txt is tracked in git; readme.txt exists locally on case-insensitive filesystems.
          for README_FILE in $README_FILES; do
            [ -f "$README_FILE" ] || continue
            sed -E -i "s/^(Tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WP}/" "$README_FILE"
            sed -E -i "s/^(Requires at least: *)[0-9]+(\.[0-9]+)*/\1${REQUIRES_WP}/" "$README_FILE"
          done

          git --no-pager diff -- "$PLUGIN_FILE" $README_FILES

          echo "wp_from=$CURRENT_WP" >> "$GITHUB_OUTPUT"
          echo "wp_to=$NEW_WP" >> "$GITHUB_OUTPUT"
          echo "wc_from=$CURRENT_WC" >> "$GITHUB_OUTPUT"
          echo "wc_to=$NEW_WC" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$PLUGIN_FILE" $README_FILES; then
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # E.g. "🤖 Update tested up to: WordPress 7.0 → 7.1, WooCommerce 11.1 → 11.2", omitting whichever did not change.
      # If only the README headers were out of sync with the plugin headers, a generic message is used.
      - name: Build commit message
        id: commit_message
        run: |
          set -euo pipefail

          PARTS=()
          if [ "$WP_FROM" != "$WP_TO" ]; then
            PARTS+=("WordPress $WP_FROM → $WP_TO")
          fi
          if [ "$WC_FROM" != "$WC_TO" ]; then
            PARTS+=("WooCommerce $WC_FROM → $WC_TO")
          fi

          if [ "${#PARTS[@]}" -eq 0 ]; then
            if [ "$FILES_CHANGED" != "true" ]; then
              echo "No version changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MESSAGE="🤖 Sync README.txt headers with plugin headers"
          else
            MESSAGE="🤖 Update tested up to: $(printf '%s, ' "${PARTS[@]}" | sed 's/, $//')"
          fi

          echo "$MESSAGE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
        env:
          WP_FROM: ${{ steps.update.outputs.wp_from }}
          WP_TO: ${{ steps.update.outputs.wp_to }}
          WC_FROM: ${{ steps.update.outputs.wc_from }}
          WC_TO: ${{ steps.update.outputs.wc_to }}
          FILES_CHANGED: ${{ steps.update.outputs.files_changed }}

      - name: Commit changes
        if: ${{ steps.commit_message.outputs.changed == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.commit_message.outputs.message }}
          file_pattern: bh-wp-venmo-gateway.php README.txt
