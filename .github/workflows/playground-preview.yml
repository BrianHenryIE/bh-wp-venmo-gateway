name: Playground Preview

# After an E2E run on a pull request whose "Build plugin archive" job succeeded, whether or not the
# tests then passed, take the plugin zip and development-plugin zip that job uploaded as an artifact, publish both to the gh-pages branch, and post (or update) a sticky comment
# linking to WordPress Playground with the plugins installed and activated, alongside every
# wpackagist plugin and theme listed in composer.json (WooCommerce, GiveWP, etc.).
#
# NB: `workflow_run` workflows only run from the copy of this file on the *default* branch, so
# this will not run on the pull request that introduces it. `workflow_run` also only fires when the
# whole E2E workflow completes, not when its build job does, so the preview is posted once the test
# matrix has finished.
#
# @author BrianHenryIE

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]

jobs:

  playground-preview:
    runs-on: ubuntu-latest

    # Only for pull requests. Whether the build job succeeded is checked in the first step, since
    # the run's overall conclusion also reflects the test results.
    if: github.event.workflow_run.event == 'pull_request'

    permissions:
      actions: read # To download the artifact from the E2E run.
      contents: write # To commit the zips to gh-pages.
      pull-requests: write # To add the comment.

    env:
      PLUGIN_SLUG: ${{ github.event.repository.name }}
      DEV_PLUGIN_SLUG: development-plugin
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:

      # Every later step depends on this one, through the pull request lookup below.
      - name: Check the build job succeeded
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "Build plugin archive") | .conclusion')
          echo "Build plugin archive: ${CONCLUSION:-not found}"
          if [ "$CONCLUSION" = "success" ]; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
          fi

      # `workflow_run` runs against the default branch, so check out the commit that was tested.
      - name: Git checkout
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true

      - name: Checkout GitHub Pages branch
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      # `github.event.workflow_run.pull_requests` is empty for pull requests from forks, so look
      # the number up from the head SHA instead.
      # When this is skipped, `found` is empty, so every step gated on it is skipped too.
      - name: Find the pull request number
        if: ${{ steps.build.outputs.succeeded == 'true' }}
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for ${HEAD_SHA}; nothing to comment on."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found pull request #${PR_NUMBER}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The E2E workflow builds the plugin zip and the development-plugin zip (the same ones it
      # tested against) and uploads them as an artifact, so there is no need to install PHP, Composer
      # or Node here and rebuild them.
      - name: Download the plugin archives built by the E2E run
        if: ${{ steps.pr.outputs.found == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: plugin-archives
          path: dist-archive
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the plugin archives
        if: ${{ steps.pr.outputs.found == 'true' }}
        id: archive
        run: |
          ls -l dist-archive
          ARCHIVE=$(find dist-archive -maxdepth 1 -name "${PLUGIN_SLUG}.*.zip" | sort | tail -n 1)
          DEV_ARCHIVE="dist-archive/${DEV_PLUGIN_SLUG}.zip"
          test -f "$ARCHIVE" || { echo "Plugin archive not found in artifact."; exit 1; }
          test -f "$DEV_ARCHIVE" || { echo "Development plugin archive not found in artifact."; exit 1; }
          echo "path=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "dev_path=${DEV_ARCHIVE}" >> "$GITHUB_OUTPUT"

      # Published to gh-pages because Playground fetches the zips from the browser: GitHub Pages
      # serves `access-control-allow-origin: *`, whereas Actions artifacts require authentication.
      - name: Publish the zips to gh-pages
        if: ${{ steps.pr.outputs.found == 'true' }}
        id: publish
        run: |
          DEST="gh-pages/${HEAD_SHA}/playground"
          BASE_URL="https://${{ github.repository_owner }}.github.io/${PLUGIN_SLUG}/${HEAD_SHA}/playground"
          mkdir -p "$DEST"
          cp "${{ steps.archive.outputs.path }}" "${DEST}/${PLUGIN_SLUG}.zip"
          cp "${{ steps.archive.outputs.dev_path }}" "${DEST}/${DEV_PLUGIN_SLUG}.zip"
          echo "url=${BASE_URL}/${PLUGIN_SLUG}.zip" >> "$GITHUB_OUTPUT"
          echo "dev_url=${BASE_URL}/${DEV_PLUGIN_SLUG}.zip" >> "$GITHUB_OUTPUT"

      - name: Pre-commit `git pull gh-pages`
        if: ${{ steps.pr.outputs.found == 'true' }}
        run: |
          cd gh-pages
          # Re-fetch: the coverage job pushes to gh-pages too, so this ref may already be stale.
          # The zips are untracked, so a force checkout keeps them.
          git fetch origin gh-pages || true
          (git ls-remote --heads --exit-code origin gh-pages &>/dev/null) && (git checkout --progress --force -B gh-pages refs/remotes/origin/gh-pages)

      - name: Commit the zips to gh-pages
        if: ${{ steps.pr.outputs.found == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: gh-pages
          branch: gh-pages
          commit_message: "🤖 Commit Playground preview build"

      - name: Build the Playground URL
        if: ${{ steps.pr.outputs.found == 'true' }}
        id: playground
        env:
          ZIP_URL: ${{ steps.publish.outputs.url }}
          DEV_ZIP_URL: ${{ steps.publish.outputs.dev_url }}
        run: |
          # Install every wpackagist plugin and theme from composer.json's `require-dev` from
          # wordpress.org, so the Playground site matches wp-env. WooCommerce is moved to the front
          # of the list so the extensions that depend on it activate after it.
          WPORG_STEPS=$(jq -c '
            (."require-dev" | keys) as $packages
            | ( [ $packages[] | select(startswith("wpackagist-plugin/")) ]
                | sort_by(. != "wpackagist-plugin/woocommerce")
                | map({
                    step: "installPlugin",
                    pluginData: { resource: "wordpress.org/plugins", slug: sub("^wpackagist-plugin/"; "") },
                    options: { activate: true }
                  }) )
            + ( [ $packages[] | select(startswith("wpackagist-theme/")) ]
                | map({
                    step: "installTheme",
                    themeData: { resource: "wordpress.org/themes", slug: sub("^wpackagist-theme/"; "") },
                    options: { activate: true }
                  }) )
          ' composer.json)

          # The blueprint is passed in the URL fragment so it does not need hosting itself.
          # The development plugin returns early unless the main plugin is active, so it is
          # installed last.
          BLUEPRINT=$(jq -cn --arg url "$ZIP_URL" --arg dev_url "$DEV_ZIP_URL" --argjson wporg "$WPORG_STEPS" '{
            "$schema": "https://playground.wordpress.net/blueprint-schema.json",
            "landingPage": "/wp-admin/admin.php?page=wc-settings&tab=checkout&section=venmo",
            "preferredVersions": { "php": "8.4", "wp": "latest" },
            "steps": (
              [ { "step": "login", "username": "admin", "password": "password" } ]
              + $wporg
              + [
                {
                  "step": "installPlugin",
                  "pluginData": { "resource": "url", "url": $url },
                  "options": { "activate": true }
                },
                {
                  "step": "installPlugin",
                  "pluginData": { "resource": "url", "url": $dev_url },
                  "options": { "activate": true }
                },
                {
                  "step": "setSiteOptions",
                  "options": {
                    "woocommerce_coming_soon": "no",
                    "woocommerce_onboarding_profile": { "skipped": true },
                    "woocommerce_venmo_settings": {
                      "enabled": "yes",
                      "title": "Venmo",
                      "description": "Pay with Venmo",
                      "store_venmo_username": "testvendor"
                    }
                  }
                }
              ]
            )
          }')
          ENCODED=$(printf '%s' "$BLUEPRINT" | jq -sRr @uri)
          echo "url=https://playground.wordpress.net/#${ENCODED}" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: ${{ steps.pr.outputs.found == 'true' }}
        uses: mshick/add-pr-comment@v3
        continue-on-error: true # Pull requests opened by non-members have no write permissions.
        with:
          issue: ${{ steps.pr.outputs.number }}
          message-id: playground-preview
          message: |
            ### ▶️ [Try this branch in WordPress Playground](${{ steps.playground.outputs.url }})

            A one-click sandbox with the plugin, the development plugin, WooCommerce, GiveWP and the
            other wp-env plugins installed and activated, opened on the Venmo gateway settings page
            and logged in as `admin`. Nothing is installed on your machine and the site is discarded
            when you close the tab.

            | | |
            |---|---|
            | Commit | [`${{ github.event.workflow_run.head_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}) |
            | Plugin zip | [`${{ github.event.repository.name }}.zip`](${{ steps.publish.outputs.url }}) |
            | Development plugin zip | [`development-plugin.zip`](${{ steps.publish.outputs.dev_url }}) |
            | E2E run | [#${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }}): `${{ github.event.workflow_run.conclusion }}` |

            <sub>Rebuilt after each E2E run whose plugin archive builds, whether or not the tests pass.</sub>
